---
- hosts: devlog_servers
  become: yes
  tasks:
    - name: Ensure DNF cache is updated
      dnf:
        update_cache: yes

    - name: Install Git, curl, and basic prerequisites
      dnf:
        name:
          - git
          - curl
          - wget
        state: present
        allowerasing: yes

    - name: Install Python3 and pip
      dnf:
        name:
          - python3
          - python3-pip
        state: present

    - name: Install Node.js 20.x LTS using NodeSource setup script
      shell: |
        curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
        dnf install -y nodejs
      args:
        executable: /bin/bash

    - name: Install Docker on Amazon Linux 2023
      dnf:
        name: docker
        state: present

    - name: Download and install Docker Compose binary
      get_url:
        url: https://github.com/docker/compose/releases/download/v2.24.0/docker-compose-linux-x86_64
        dest: /usr/local/bin/docker-compose
        mode: '0755'

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ec2-user to the docker group so you don't need sudo for docker commands
      user:
        name: ec2-user
        groups: docker
        append: yes

    - name: Clone or sync application repository
      git:
        repo: 'https://github.com/digambar-ratate/devlog-Docker-.git'
        dest: /opt/devlog
        version: main
        force: yes

    - name: Start Docker Compose stack on remote server
      command: docker-compose up --build -d
      args:
        chdir: /opt/devlog
